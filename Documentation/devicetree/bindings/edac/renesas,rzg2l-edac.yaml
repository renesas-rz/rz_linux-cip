%YAML 1.2
---
$id: http://devicetree.org/schemas/edac/renesas,rzg2l-edac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas Memory Controller EDAC

maintainers:
  - Hung Tran <hung.tran.jy@renesas.com>

description: |
  EDAC node is defined to describe error detection and correction for
  Renesas Memory Controller.

properties:

  compatible:
    enum:
      - renesas,r9a07g043-edac
      - renesas,r9a07g043f-edac
      - renesas,r9a07g044-edac
      - renesas,r9a07g054-edac
      - renesas,r9a07g076-edac

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-names:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    edac: edac@80300000 {
        compatible = "renesas,r9a07g076-edac";
        reg = <0 0x80300000 0 0x10000>;
        interrupts = <GIC_SPI 629 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "ecc_irq";
    };

