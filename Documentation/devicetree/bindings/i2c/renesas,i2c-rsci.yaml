%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/renesas,i2c-rsci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas Serial Communication Interface (RSCI) I2C Master Controller

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - renesas,r9a08g046-rz-rsci # RZ/G3L
              - renesas,rz-rsci-i2c    # RSCI I2C mode

  reg:
    maxItems: 1

  interrupts:
    items:
        - description: Error Interrupt
        - description: Reception End Interrupt
        - description: Transmit End Interrupt
        - description: Completion Of Generation Of
                       A Start, Restart, Or Stop Condition (STI) Interrupt

  interrupt-names:
    items:
        - const: eri
        - const: rxi
        - const: txi
        - const: tei

  clock-frequency:
    description:
      Desired I2C bus clock frequency in Hz. The absence of this property
      indicates the default frequency 100 kHz.

  clocks:
    maxItems: 2

  clock-names:
    items:
      - const: fck
      - const: tclk

  resets:
    maxItems: 2

  reset-names:
    items:
      - const: presetn
      - const: tresetn

  power-domains:
    maxItems: 1

  status:
    maxItems: 1

if:
  properties:
    status:
      const: "okay"
then:
  properties:
    compatible:
        contains:
            const: renesas,rz-rsci-i2c

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - power-domains
  - clock-frequency
  - status

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/r9a08g046-cpg.h>
    rsci: i2c@100f1000 {
        compatible = "renesas,r9a08g046-rz-rsci", "renesas,rz-rsci-i2c";
        reg = <0 0x100f1000 0 0x1000>;
        interrupts = <GIC_SPI 422 IRQ_TYPE_LEVEL_HIGH>,
                    <GIC_SPI 423 IRQ_TYPE_EDGE_RISING>,
                    <GIC_SPI 424 IRQ_TYPE_EDGE_RISING>,
                    <GIC_SPI 425 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "eri", "rxi", "txi", "tei";
        clocks = <&cpg CPG_MOD R9A08G046_RSCI1_PCLK>,
            <&cpg CPG_MOD R9A08G046_RSCI1_TCLK>;
        clock-names = "fck", "tclk";
        power-domains = <&cpg>;
        resets = <&cpg R9A08G046_RSCI1_PRESETN>,
            <&cpg R9A08G046_RSCI1_TRESETN>;
        reset-names = "presetn", "tresetn";
        clock-frequency = <100000>;
        status = "disabled";
    };
