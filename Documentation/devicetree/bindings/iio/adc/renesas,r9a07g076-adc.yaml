%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/renesas,r9a07g076-adc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas RZ/T2N ADC12

maintainers:
  - Cosmin Tanislav <cosmin-gabriel.tanislav.xa@renesas.com>

description: |
  A/D Converter block is a successive approximation analog-to-digital converter
  with a 12-bit accuracy. Up to 15 analog input channels can be selected.
  Conversions can be performed in single or continuous mode. Result of the ADC
  is stored in a 16-bit data register corresponding to each channel.

properties:
  compatible:
    enum:
      - renesas,r9a07g076-adc # RZ/T2N

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: A/D scan end interrupt
      - description: A/D scan end interrupt for Group B
      - description: A/D scan end interrupt for Group C
      - description: Window A compare match
      - description: Window B compare match
      - description: Compare match
      - description: Compare mismatch

  interrupt-names:
    items:
      - const: adi
      - const: gbadi
      - const: gcadi
      - const: cmpai
      - const: cmpbi
      - const: wcmpm
      - const: wcmpum

  clocks:
    items:
      - description: converter clock
      - description: peripheral clock

  clock-names:
    items:
      - const: adclk
      - const: pclk

  power-domains:
    maxItems: 1

  renesas,max-channels:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Maximum number of channels supported by the ADC.
      RZ/T2H has two ADCs with 4 channels and one with 8 channels.

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

  "#io-channel-cells":
    const: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - power-domains
  - renesas,max-channels

patternProperties:
  "^channel@[0-9a-e]$":
    $ref: adc.yaml
    type: object
    description: The external channels which are connected to the ADC.

    properties:
      reg:
        description: The channel number.
        maximum: 16

    required:
      - reg

    additionalProperties: false

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: renesas,r9a07g076-adc
    then:
      properties:
        renesas,max-channels:
          enum: [4, 8]

      patternProperties:
        "^channel@[6-9a-e]$": false
        "^channel@[0-5]$":
          properties:
            reg:
              maximum: 5

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/renesas,r9a07g076-cpg.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    adc0: adc0@90014000 {
      compatible = "renesas,r9a07g076-adc";
      reg = <0x80008000 0x400>;
      interrupts = <GIC_SPI 553 IRQ_TYPE_EDGE_RISING>,
                   <GIC_SPI 554 IRQ_TYPE_EDGE_RISING>,
                   <GIC_SPI 555 IRQ_TYPE_EDGE_RISING>,
                   <GIC_SPI 556 IRQ_TYPE_LEVEL_HIGH>,
                   <GIC_SPI 557 IRQ_TYPE_LEVEL_HIGH>,
                   <GIC_SPI 661 IRQ_TYPE_EDGE_RISING>,
                   <GIC_SPI 662 IRQ_TYPE_EDGE_RISING>;
      interrupt-names = "adi", "gbadi", "gcadi",
                        "cmpai", "cmpbi", "wcmpm", "wcmpum";
      clocks = <&cpg CPG_MOD R9A07G076_ADC0_CLK>;
      power-domains = <&cpg>;
      #address-cells = <1>;
      #size-cells = <0>;
      #io-channel-cells = <1>;
      renesas,max-channels = <4>;

      channel@0 {
        reg = <0x0>;
      };
      channel@1 {
        reg = <0x1>;
      };
      channel@2 {
        reg = <0x2>;
      };
      channel@3 {
        reg = <0x3>;
      };
    };
