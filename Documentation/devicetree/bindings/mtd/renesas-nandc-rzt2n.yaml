%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/renesas-nandc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas RZ/T2N NAND controller

maintainers:
  - Hung Tran <hung.tran.jy@renesas.com>

allOf:
  - $ref: nand-controller.yaml

properties:
  compatible:
    const: renesas,r9a07g076-nandc # RZ/T2N

  reg:
    maxItems: 3

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 3

  clock-names:
    items:
      - const: nf_clk
      - const: sysclk
      - const: busclk

  resets:
    maxItems: 3

  reset-names:
    items:
      - const: rst_sys
      - const: rst_slave
      - const: rst_prot

  power-domains:
    maxItems: 1

  timing-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      NAND timing mode index used by the controller driver.
      Valid values are 0..5. If omitted, the driver uses the default mode.
    minimum: 0
    maximum: 5

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets
  - reset-names
  - power-domains
  - '#address-cells'
  - '#size-cells'

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/r9a06g032-sysctrl.h>

    nandc: nandc@92050000 {
        compatible = "renesas,r9a07g076-nandc";
        reg = <0 0x92050000 0 0x4000>,
              <0 0x10100000 0 0x100000>,
              <0 0x80297000 0 0x50>;
        interrupts = <GIC_SPI 628 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&cpg CPG_MOD R9A07G076_NANDC_CLK>,
                 <&cpg CPG_CORE R9A07G076_PCLKAM>,
                 <&cpg CPG_CORE R9A07G076_PCLKAL>;
        clock-names = "nf_clk", "sysclk", "busclk";
        resets = <&cpg R9A07G076_NANDC_SYSTEM_RST>,
                 <&cpg R9A07G076_NANDC_SLAVE_RST>,
                 <&cpg R9A07G076_NANDC_PROTECT_RST>;
        reset-names = "rst_sys", "rst_slave", "rst_prot";
        power-domains = <&cpg>;
        #address-cells = <1>;
        #size-cells = <0>;
        status = "disabled";
    };

    &nandc {
        pinctrl-0 = <&nandc_pins>;
        pinctrl-names = "default";

        status = "okay";

        nand@0 {
            reg = <0>;
            label = "nand0";
            timing-mode = <3>;

            partitions {
                compatible = "fixed-partitions";
                #address-cells = <1>;
                #size-cells = <2>;

                partition@0 {
                    label = "nand-partition";
                    reg = <0x00000000 0x1 0x00000000>;
                };
            };
        };
    };
