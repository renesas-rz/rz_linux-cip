%YAML 1.2
---
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas RZ/T2H Ethercat Slave Controller

description: |
  The Ethercat Slave Controller is present on the Renesas RZ/T2H SoC
  family and handles 3 ports.

allOf:
  - $ref: dsa.yaml#/$defs/ethernet-ports

properties:
  compatible:
    items:
      - enum:
          - renesas,rzt2h-esc
          - renesas,rzn2h-esc

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: EtherCAT Sync0 interrupt
      - description: EtherCAT Sync1 interrupt
      - description: EtherCAT interrupt

  interrupt-names:
    items:
      - const: sync0irq
      - const: sync1irq
      - const: catirq

  power-domains:
    maxItems: 1

  mdio:
    $ref: /schemas/net/mdio.yaml#
    unevaluatedProperties: false

  clocks:
    items:
      - description: ESC system clock

  ethernet-ports:
    type: object
    properties:
      '#address-cells':
        const: 1
      '#size-cells':
        const: 0

    patternProperties:
      "^(ethernet-)?port@[0-2]$":
        type: object
        description: ESC ports

        properties:
          pcs-handle:
            maxItems: 1
            description:
              phandle pointing to a PCS sub-node compatible with
              renesas,rzt2h-ethss.yaml#

unevaluatedProperties: false

required:
  - compatible
  - reg
  - clocks
  - power-domains

examples:
  - |

	esc: esc@80130000 {
		compatible = "renesas,rzt2h-esc";
		reg =  <0 0x80130000 0 0x10000>;
		interrupts = <GIC_SPI 579 IRQ_TYPE_EDGE_RISING>,
			     <GIC_SPI 580 IRQ_TYPE_EDGE_RISING>,
			     <GIC_SPI 581 IRQ_TYPE_LEVEL_HIGH>;
		interrupt-names = "sync0irq", "sync1irq", "catirq";
		clocks = <&cpg CPG_MOD R9A09G077_ESC_CLK>;
		resets = <&cpg R9A09G077_ESC_BUS_RST>,
			 <&cpg R9A09G077_ESC_IP_RST>;
		reset-names = "reset_bus", "reset_ip";
		power-domains = <&cpg>;
		eeprom-size = <0>;
		phy-address-offset = <0>;
		txc-port-delay = <0>;
		status = "disabled";

		ethernet-ports {
			#address-cells = <1>;
			#size-cells = <0>;

			esc_port0: port@0 {
				reg = <0>;
				pcs-handle = <&mii_conv0>;
				status = "disabled";
			};

			esc_port1: port@1 {
				reg = <1>;
				pcs-handle = <&mii_conv1>;
				status = "disabled";
			};

			esc_port2: port@2 {
				reg = <2>;
				pcs-handle = <&mii_conv2>;
				status = "disabled";
			};
		};

		mdio {
			#address-cells = <1>;
			#size-cells = <0>;

			phy0: ethernet-phy@0 {
				compatible = "ethernet-phy-id0007.0772";
				phy-mode = "rgmii-id";
				vsc8531,led-1-mode = <VSC8531_FORCE_LED_ON>;
				max-speed = <100>;
				reg = <0>;
			};

			phy1: ethernet-phy@1 {
				compatible = "ethernet-phy-id0007.0772";
				phy-mode = "rgmii-id";
				vsc8531,led-1-mode = <VSC8531_FORCE_LED_ON>;
				max-speed = <100>;
				reg = <1>;
			};

			phy2: ethernet-phy@2 {
				compatible = "ethernet-phy-id0007.0772";
				phy-mode = "rgmii-id";
				vsc8531,led-1-mode = <VSC8531_FORCE_LED_ON>;
				max-speed = <100>;
				reg = <2>;
			};
		};
	};
