%YAML 1.2
---
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas RZ/T2N HSR/PRP Switch

maintainers:
  - Nhat Nguyen <nhat.nguyen.xb@renesas.com>

properties:
  compatible:
    const: renesas,rzt2n-hpsw

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  power-domains:
    maxItems: 1

  ethernet-ports:
    type: object
    properties:
      '#address-cells':
        const: 1
      '#size-cells':
        const: 0

    patternProperties:
      "^(ethernet-)?port@[0-2]$":
        type: object
        description: Port number of HSR/PRP switch (HPSW).

        properties:
          pcs-handle:
            maxItems: 1
            description:
              phandle pointing to a PCS sub-node compatible with
              renesas,rzt2-ethss.yaml#

unevaluatedProperties: false

required:
  - compatible
  - reg
  - clocks
  - resets
  - power-domains

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/renesas,r9a07g076-cpg.h>

    hpsw: hpsw@80170000 {
       compatible = "renesas,rzt2n-hpsw";
       reg = <0 0x80170000 0 0x50000>;
       clocks = <&cpg CPG_MOD R9A07G076_HPSW_CLK>;
       resets = <&cpg R9A07G076_HPSW_RST>;
       power-domains = <&cpg>;
       status = "disabled";

       ethernet-ports {
               #address-cells = <1>;
               #size-cells = <0>;

               hpsw_portA: port@0 {
                     reg = <0>;
                     pcs-handle = <&mii_conv0>;
                     phy-mode = "rgmii-id";
                     phy-handle = <&phy0>;
                     status = "okay";
               };

               hpsw_portB: port@1 {
                     reg = <1>;
                     pcs-handle = <&mii_conv1>;
                     phy-mode = "rgmii-id";
                     phy-handle = <&phy1>;
                     status = "okay";
               };

               hpsw_portC: port@2 {
                     reg = <2>;
                     ethernet = <&gmac0>;
                     label = "cpu";
                     phy-mode = "internal";
                     status = "okay";
                     fixed-link {
                             speed = <1000>;
                             full-duplex;
                     };
               };
         };
    };
