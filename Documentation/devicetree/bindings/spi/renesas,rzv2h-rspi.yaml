%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/renesas,rzv2h-rspi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas RZ/V2H(P) Renesas Serial Peripheral Interface (RSPI)

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    const: renesas,rspi-v2h # RZ/V2H(P)

  reg:
    maxItems: 1

  interrupts:
    items:
      - description: Error Interrupt
      - description: Communication End Interrupt
      - description: Receive Buffer Full Interrupt
      - description: Transmit Buffer Empty Interrupt

  interrupt-names:
    items:
      - const: error
      - const: cend
      - const: rx
      - const: tx

  clocks:
    maxItems: 3

  clock-names:
    items:
      - const: pclk
      - const: pclk_sfr
      - const: tclk

  resets:
    maxItems: 2

  reset-names:
    items:
      - const: presetn
      - const: tresetn

  dmas:
    maxItems: 2

  dma-names:
    items:
      - const: tx
      - const: rx

  power-domains:
    maxItems: 1

  num-cs:
    maxItems: 1

  status:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - dmas
  - dma-names
  - power-domains
  - num-cs
  - '#address-cells'
  - '#size-cells'
  - status

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/renesas-cpg-mssr.h>
    spi@12800800 {
	compatible = "renesas,rspi-v2h";
	reg = <0 0x12800800 0 0x400>;
	interrupts = <GIC_SPI 112 IRQ_TYPE_LEVEL_HIGH>,
		     <GIC_SPI 113 IRQ_TYPE_EDGE_RISING>,
		     <GIC_SPI 504 IRQ_TYPE_EDGE_RISING>,
		     <GIC_SPI 505 IRQ_TYPE_EDGE_RISING>;
	interrupt-names = "error", "cend", "rx", "tx";
	clocks = <&cpg CPG_MOD 90>,
		<&cpg CPG_MOD 91>,
		<&cpg CPG_MOD 92>;
	clock-names = "pclk", "pclksfr", "tclk";
	resets = <&cpg 127>,
		 <&cpg 128>;
	reset-names = "presetn", "tresetn";
	dmas = <&dmac1 0x7F4491>, <&dmac1 0x7F4490>;
	dma-names = "tx", "rx";
	power-domains = <&cpg>;
	num-cs = <1>;
	#address-cells = <1>;
	#size-cells = <0>;
	status = "disabled";
   };

