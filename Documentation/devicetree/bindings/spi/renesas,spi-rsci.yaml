%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/renesas,spi-rsci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas Serial Communication Interface (RSCI) SPI Controller

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - renesas,r9a08g046-rz-rsci # RZ/G3L
              - renesas,rz-rsci-spi       # RSCI SPI mode

  reg:
    maxItems: 1

  interrupts:
    oneOf:
      - items:
          - description: Error Interrupt
          - description: Receive Data Full Interrupt
          - description: Transmit Data Empty Interrupt
          - description: Transmit End Interrupt

  interrupt-names:
    oneOf:
      - items:
          - const: eri
          - const: rxi
          - const: txi
          - const: tei

  clocks:
    maxItems: 2

  clock-names:
    items:
      - const: fck
      - const: tclk

  resets:
    maxItems: 2

  reset-names:
    items:
      - const: presetn
      - const: tresetn

  dmas:
    maxItems: 2

  dma-names:
    items:
      - const: tx
      - const: rx

  power-domains:
    maxItems: 1

  num-cs:
    maxItems: 1

  status:
    maxItems: 1

if:
  properties:
    status:
      const: "okay"
then:
  properties:
    compatible:
        contains:
            const: renesas,rz-rsci-spi

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - dmas
  - dma-names
  - power-domains
  - num-cs
  - '#address-cells'
  - '#size-cells'
  - status

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/r9a08g046-cpg.h>
    rsci: spi@100f1000 {
        compatible = "renesas,r9a08g046-rz-rsci", "renesas,rz-rsci-spi";
        reg = <0 0x100f1000 0 0x1000>;
        interrupts = <GIC_SPI 422 IRQ_TYPE_LEVEL_HIGH>,
                    <GIC_SPI 423 IRQ_TYPE_EDGE_RISING>,
                    <GIC_SPI 424 IRQ_TYPE_EDGE_RISING>,
                    <GIC_SPI 425 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "eri", "rxi", "txi", "tei";
        clocks = <&cpg CPG_MOD R9A08G046_RSCI1_PCLK>,
            <&cpg CPG_MOD R9A08G046_RSCI1_TCLK>;
        clock-names = "fck", "tclk";
        power-domains = <&cpg>;
        resets = <&cpg R9A08G046_RSCI1_PRESETN>,
            <&cpg R9A08G046_RSCI1_TRESETN>;
        reset-names = "presetn", "tresetn";
        dmas = <&dmac 0xc6d9>, <&dmac 0xc6da>;
        dma-names = "tx", "rx";
        num-cs = <1>;
        #address-cells = <1>;
        #size-cells = <0>;
        status = "disabled";
    };

